schema_version: 1

context:
  name: probabilit
  version: "0.5.2"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/probabilit-${{ version }}.tar.gz
  sha256: 0c42b52562a1a15011b0613aaf6e4d8e9fb405f687773aa40c91d2e2f3a0ffab

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=66.1
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2.2
    - scipy
    - networkx
    - seaborn
    - pandas
    - cvxpy
    # not listed but needed
    - cffi
    - setuptools >=66.1

tests:
  - python:
      imports:
        - probabilit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/equinor/probabilit
  summary: A Python package for Monte Carlo sampling.
  license: GPL-3.0-only
  license_file: COPYING

extra:
  recipe-maintainers:
    - thewchan
